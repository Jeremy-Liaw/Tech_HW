<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資訊小教室</title>
  <meta name="description" content="不需要任何基礎，用模擬器與小遊戲學會電腦、網路與資安的基本知識。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>

  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">01</span>
        <span>資訊小教室</span>
      </a>
      <nav aria-label="主選單">
        <a href="#/" data-nav="home">首頁</a>
        <a href="#/profile" data-nav="profile">個人檔案</a>
      </nav>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <noscript><p class="muted">這個網站需要開啟 JavaScript 才能使用。</p></noscript>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="dialog" aria-labelledby="dlg-title">
    <form method="dialog">
      <h2 id="dlg-title"></h2>
      <p id="dlg-body" class="muted"></p>
      <div class="btn-row">
        <button class="btn" value="cancel">取消</button>
        <button class="btn btn-danger" id="dlg-ok" value="ok"></button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
